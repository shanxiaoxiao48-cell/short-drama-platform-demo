    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {

        }
        .error {
            color: red;
        }
        .success {

        }
        .info {

        }
        .warning {

        function log(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            resultDiv.appendChild(p);
        }
        
        function checkLocalStorage() {
            const resultDiv = document.getElementById('result');
            const dataDiv = document.getElementById('localstorage-data');
            const variantsDiv = document.getElementById('variants-data');
            resultDiv.innerHTML = '';
            dataDiv.innerHTML = '';
            variantsDiv.innerHTML = '';
            
            try {
                log('检查 localStorage 数据...');
                
                // 检查 drama-projects
                const dramaProjects = localStorage.getItem('drama-projects');
                if (dramaProjects) {
                    const projects = JSON.parse(dramaProjects);
                    log(`找到 ${projects.length} 个项目`, 'success');
                    dataDiv.innerHTML = '<h3>drama-projects:</h3><pre>' + JSON.stringify(projects, null, 2) + '</pre>';
                    
                    // 检查每个项目的变体数据
                    projects.forEach(project => {
                        const variantsKey = `project-${project.id}-variants`;
                        const variantsData = localStorage.getItem(variantsKey);
                        if (variantsData) {
                            try {
                                const variants = JSON.parse(variantsData);
                                variantsDiv.innerHTML += `<h3>project-${project.id}-variants:</h3><pre>${JSON.stringify(variants, null, 2)}</pre>`;
                            } catch (e) {
                                variantsDiv.innerHTML += `<h3 class="error">project-${project.id}-variants: 解析错误</h3>`;
                            }
                        } else {
                            variantsDiv.innerHTML += `<h3 class="warning">project-${project.id}-variants: 不存在</h3>`;
                        }
                    });
                } else {
                    log('localStorage 中没有 drama-projects 数据', 'error');
                }
                
                // 检查所有 localStorage 键
                log('\n所有 localStorage 键:', 'info');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    log(`- ${key}`, 'info');
                }
                
            } catch (error) {
                log(`检查过程中出错: ${error.message}`, 'error');
            }
        }

                log('所有数据导入完成！', 'success');

                setTimeout(checkLocalStorage, 500);
                
            } catch (error) {

            }
        }
        
        function clearLocalStorage() {
            if (confirm('确定要清空所有 localStorage 数据吗？')) {
                localStorage.clear();
                log('已清空所有 localStorage 数据', 'success');
                checkLocalStorage();
            }
        }
        
        // 页面加载时自动检查
        window.onload = function() {
            checkLocalStorage();
        };
    </script>
</body>
</html>
