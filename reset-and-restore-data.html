        button {
            background-color: #4CAF50;

            padding: 15px 30px;

        .step {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #fafafa;

        function log(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            resultDiv.appendChild(p);
        }
        
        function clearAllData() {
            const resultDiv = document.getElementById('result');
            const detailsDiv = document.getElementById('data-details');
            resultDiv.innerHTML = '';
            detailsDiv.innerHTML = '';
            
            try {
                log('开始清空所有数据...');
                
                // 清空所有 localStorage 数据
                localStorage.clear();
                
                log('所有数据已成功清空！', 'success');
                log('现在可以进入步骤 2 导入完整数据。', 'info');
                
            } catch (error) {
                log(`清空数据时出错: ${error.message}`, 'error');
            }
        }
        
        function importCompleteData() {
            const resultDiv = document.getElementById('result');
            const detailsDiv = document.getElementById('data-details');
            resultDiv.innerHTML = '';
            detailsDiv.innerHTML = '';
            
            try {
                log('开始导入完整数据...');
                
                // 导入项目基本数据
                localStorage.setItem('drama-projects', JSON.stringify(projectData));
                log(`成功导入 ${projectData.length} 个项目`, 'success');
                
                // 导入每个项目的语言变体数据
                Object.keys(variantsData).forEach(projectId => {
                    localStorage.setItem(`project-${projectId}-variants`, JSON.stringify(variantsData[projectId]));
                    log(`成功导入项目 ${projectId} 的 ${variantsData[projectId].length} 个语言变体`, 'success');
                });
                
                log('完整数据导入完成！', 'success');
                log('现在可以进入步骤 3 验证数据恢复情况。', 'info');
                
                // 显示导入的数据
                detailsDiv.innerHTML = '<h3>导入的项目数据:</h3><pre>' + JSON.stringify(projectData, null, 2) + '</pre>';
                
            } catch (error) {
                log(`导入数据时出错: ${error.message}`, 'error');
            }
        }
        
        function verifyData() {
            const resultDiv = document.getElementById('result');
            const detailsDiv = document.getElementById('data-details');
            resultDiv.innerHTML = '';
            detailsDiv.innerHTML = '';
            
            try {
                log('开始验证数据恢复情况...');
                
                // 检查项目数据
                const dramaProjects = localStorage.getItem('drama-projects');
                if (dramaProjects) {
                    const projects = JSON.parse(dramaProjects);
                    log(`找到 ${projects.length} 个项目`, 'success');
                    
                    // 检查每个项目的变体数据
                    projects.forEach(project => {
                        const variantsKey = `project-${project.id}-variants`;
                        const variantsData = localStorage.getItem(variantsKey);
                        if (variantsData) {
                            try {
                                const variants = JSON.parse(variantsData);
                                log(`项目 ${project.id} - ${project.title}: ${variants.length} 个语言变体`, 'success');
                            } catch (e) {
                                log(`项目 ${project.id} - ${project.title}: 变体数据解析错误`, 'error');
                            }
                        } else {
                            log(`项目 ${project.id} - ${project.title}: 缺少变体数据`, 'error');
                        }
                    });
                    
                    detailsDiv.innerHTML = '<h3>验证结果:</h3><pre>' + JSON.stringify(projects, null, 2) + '</pre>';
                } else {
                    log('未找到项目数据', 'error');
                }
                
            } catch (error) {
                log(`验证数据时出错: ${error.message}`, 'error');
            }
        }
